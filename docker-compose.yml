services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abide}
      POSTGRES_USER: ${POSTGRES_USER:-abide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abide_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abide} -d ${POSTGRES_DB:-abide}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

