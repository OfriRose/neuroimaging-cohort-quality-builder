version: 2

models:
  - name: stg_abide_participants
    description: >
      Cleaned ABIDE I phenotypic metadata. Blank values and -9999 are converted
      to NULL; raw source rows are preserved without eligibility filtering.

    columns:
      - name: subject_id
        description: ABIDE participant identifier.
        data_tests:
          - not_null
          - unique

      - name: site_id
        description: Data-acquisition site.
        data_tests:
          - not_null

      - name: sex
        description: Normalized biological sex derived from the ABIDE source code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["male", "female"]

      - name: diagnostic_group
        description: Normalized ABIDE diagnostic group.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "autism spectrum disorder"
                  - "typically developing control"

      - name: age_at_scan
        description: Participant age at scan. Plausibility is audited separately.
        data_tests:
          - not_null